name: Deploy FastAPI to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'          # הנתיב של תיקיית ה-FastAPI שלך
      - 'src/**'
      - 'Dockerfile'
      - 'requirements.txt'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: YOUR_CLOUD_RUN_SERVICE_NAME   # שם השירות שלך ב-Cloud Run
          region: YOUR_REGION                    # למשל us-central1 או me-west1
          source: .
