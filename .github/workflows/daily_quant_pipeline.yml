name: Swing Quant Engine — Autonomous Daily EOD Pipeline

on:
  schedule:
    # Runs at 21:30 UTC Monday–Friday (immediately post-US market close: 16:30 EST / 17:30 EDT)
    - cron: '30 21 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Execute pipeline in dry-run mode without persisting or committing state changes'
        required: false
        type: boolean
        default: false
      target_date:
        description: 'Optional ISO target EOD settlement date override (YYYY-MM-DD)'
        required: false
        type: string
        default: ''

concurrency:
  group: swing-quant-eod-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-quant-engine:
    name: Autonomous EOD Screening, Triple-Barrier & Ledger Sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Up Python 3.11 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gate 1 — Mathematical & Risk Invariant Verification
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          DRY_RUN: 'true'
        run: |
          pytest -v --tb=short

      - name: Gate 2 — Autonomous Daily EOD Execution
        env:
          PYTHONPATH: .
          ENVIRONMENT: ${{ github.event.inputs.dry_run == 'true' && 'sandbox' || 'production' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          ARGS=("--mode" "daily")
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS+=("--date" "${{ github.event.inputs.target_date }}")
          fi
          python -m src.main "${ARGS[@]}"

      - name: Gate 3 — Atomic Virtual Ledger Persistence Commit
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f "data/virtual_portfolio.json" ]; then
            git add data/virtual_portfolio.json
          fi

          if git diff --staged --quiet; then
            echo "No changes to data/virtual_portfolio.json detected."
          else
            COMMIT_DATE="${{ github.event.inputs.target_date }}"
            if [ -z "$COMMIT_DATE" ]; then
              COMMIT_DATE="$(date -u +'%Y-%m-%d')"
            fi
            git commit -m "chore(ledger): atomic EOD virtual portfolio update (${COMMIT_DATE}) [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
