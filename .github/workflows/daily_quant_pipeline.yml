name: Swing Quant Engine — Autonomous Daily EOD Pipeline

on:
  schedule:
    # Runs at 21:45 UTC Monday–Friday (23:45 IST, after US market close & settlement)
    - cron: '45 21 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Execute pipeline in dry-run mode without persisting or committing state changes'
        required: false
        type: boolean
        default: false
      target_date:
        description: 'Optional ISO target EOD settlement date override (YYYY-MM-DD)'
        required: false
        type: string
        default: ''
      reset_portfolio:
        description: 'Operator Action: Reset portfolio to $100,000.00 baseline (0 holdings) and re-arm Kill-Switch (ARMED_READY)'
        required: false
        type: boolean
        default: false
      confirm_reset:
        description: 'Confirmation Safeguard: Type RESET_PORTFOLIO_100K when reset_portfolio is enabled'
        required: false
        type: string
        default: ''

concurrency:
  group: swing-quant-eod-pipeline
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  run-quant-engine:
    name: Autonomous EOD Screening, Triple-Barrier & Ledger Sync
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set Up Python 3.11 with Pip Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f "requirements-api.txt" ]; then
            pip install -r requirements-api.txt
          fi

      - name: Authenticate to Google Cloud via Workload Identity Federation (OIDC)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Authenticate to Google Cloud via Service Account Key (Fallback)
        if: ${{ (vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' || vars.GCP_SERVICE_ACCOUNT == '') && env.GCP_SA_KEY != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Gate 0 — Pre-Flight System Integrity Audit
        run: python scripts/verify_system.py

      - name: Gate 1 — Mathematical, Risk & API Contract Verification
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          DRY_RUN: 'true'
        run: |
          pytest -v --tb=short

      - name: Gate 2 — Autonomous Daily EOD Execution, Baseline Reset & GCS Telemetry Export
        env:
          PYTHONPATH: .
          ENVIRONMENT: ${{ github.event.inputs.dry_run == 'true' && 'sandbox' || 'production' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && 'true' || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SIRIX_GCS_BUCKET: ${{ vars.SIRIX_GCS_BUCKET || vars.GCS_BUCKET_NAME || secrets.SIRIX_GCS_BUCKET || secrets.GCS_BUCKET_NAME || 'sirix-quant-state-prod' }}
          GCS_BUCKET_NAME: ${{ vars.SIRIX_GCS_BUCKET || vars.GCS_BUCKET_NAME || secrets.SIRIX_GCS_BUCKET || secrets.GCS_BUCKET_NAME || 'sirix-quant-state-prod' }}
          INTERNAL_SCHEDULER_TOKEN: ${{ secrets.INTERNAL_SCHEDULER_TOKEN }}
          SIRIX_CLOUD_RUN_URL: ${{ vars.SIRIX_CLOUD_RUN_URL || secrets.SIRIX_CLOUD_RUN_URL }}
          RESET_PORTFOLIO: ${{ github.event.inputs.reset_portfolio == 'true' && 'true' || 'false' }}
          CONFIRM_RESET: ${{ github.event.inputs.confirm_reset }}
        run: |
          if [ "${RESET_PORTFOLIO}" = "true" ]; then
            if [ "${CONFIRM_RESET}" != "RESET_PORTFOLIO_100K" ]; then
              echo "::error::Portfolio reset aborted: confirm_reset must be set to RESET_PORTFOLIO_100K"
              exit 1
            fi
            ARGS=("--mode" "reset" "--confirm-reset" "${CONFIRM_RESET}")
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              ARGS+=("--dry-run")
            fi
            if [ -n "${{ github.event.inputs.target_date }}" ]; then
              ARGS+=("--date" "${{ github.event.inputs.target_date }}")
            fi
            python -m src.main "${ARGS[@]}"
          else
            # Hydrate data/virtual_portfolio.json from GCS if absent locally (e.g., stateless runner)
            python - <<'PY'
          import logging
          import os
          from pathlib import Path
          from src.storage import StatelessGCSStateReader

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("SIRIX.GHA.GCSHydrate")

          vp_path = Path("data/virtual_portfolio.json")
          bucket_name = (os.environ.get("SIRIX_GCS_BUCKET") or os.environ.get("GCS_BUCKET_NAME") or "").strip()
          if not vp_path.is_file() and bucket_name:
              reader = StatelessGCSStateReader(bucket_name=bucket_name)
              try:
                  raw = reader._fetch_raw_bytes("state/virtual_portfolio.json")
                  if raw is not None:
                      vp_path.parent.mkdir(parents=True, exist_ok=True)
                      vp_path.write_text(raw.decode("utf-8"), encoding="utf-8")
                      logger.info("Hydrated data/virtual_portfolio.json from gs://%s/state/virtual_portfolio.json", reader.bucket_name)
              except Exception as exc:
                  logger.info("No prior GCS state found (clean Day-1 initialization): %s", exc)
          PY

            ARGS=("--mode" "daily")
            if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
              ARGS+=("--dry-run")
            fi
            if [ -n "${{ github.event.inputs.target_date }}" ]; then
              ARGS+=("--date" "${{ github.event.inputs.target_date }}")
            fi
            python -m src.main "${ARGS[@]}"
          fi

          # Synchronize canonical F01 state artifacts (state/virtual_portfolio.json & state/eod_telemetry.json) to GCS
          if [ "${{ github.event.inputs.dry_run }}" != "true" ]; then
            python - <<'PY'
          import json
          import logging
          import os
          from pathlib import Path
          from src.storage import StatelessGCSStateReader

          logging.basicConfig(level=logging.INFO)
          logger = logging.getLogger("SIRIX.GHA.GCSSync")

          bucket_name = (os.environ.get("SIRIX_GCS_BUCKET") or os.environ.get("GCS_BUCKET_NAME") or "").strip()
          if bucket_name:
              reader = StatelessGCSStateReader(bucket_name=bucket_name)
              vp_path = Path("data/virtual_portfolio.json")
              hb_path = Path("data/eod_heartbeat.json")
              try:
                  if vp_path.is_file():
                      vp_payload = json.loads(vp_path.read_text(encoding="utf-8"))
                      backend = reader.write_json_atomically("state/virtual_portfolio.json", vp_payload)
                      logger.info("Synced state/virtual_portfolio.json via backend=%s", backend)
                  if hb_path.is_file():
                      hb_payload = json.loads(hb_path.read_text(encoding="utf-8"))
                      reader.write_json_atomically("state/eod_telemetry.json", hb_payload)
                      reader.write_json_atomically("state/eod_heartbeat.json", hb_payload)
                      logger.info("Synced state/eod_telemetry.json and state/eod_heartbeat.json")
              except Exception as exc:
                  logger.warning("GCS state sync skipped or deferred to local commit: %s", exc)
          PY

            # Trigger Cloud Run in-memory TTL cache invalidation if endpoint & token are configured
            if [ -n "${SIRIX_CLOUD_RUN_URL:-}" ] && [ -n "${INTERNAL_SCHEDULER_TOKEN:-}" ]; then
              curl -fsS -X POST "${SIRIX_CLOUD_RUN_URL%/}/api/internal/trigger-eod" \
                -H "X-Sirix-Scheduler-Token: ${INTERNAL_SCHEDULER_TOKEN}" || true
            fi
          fi

      - name: Gate 3 — Atomic Virtual Ledger Persistence Commit
        if: ${{ success() && github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f "data/virtual_portfolio.json" ]; then
            echo "No data/virtual_portfolio.json file present."
            exit 0
          fi

          STAGE_FILE="$(mktemp)"
          trap 'rm -f "${STAGE_FILE}"' EXIT
          cp -p "data/virtual_portfolio.json" "${STAGE_FILE}"

          COMMIT_DATE="${{ github.event.inputs.target_date }}"
          if [ -z "$COMMIT_DATE" ]; then
            COMMIT_DATE="$(date -u +'%Y-%m-%d')"
          fi

          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}" --depth=1
            git reset --hard FETCH_HEAD
            mkdir -p data
            cp -p "${STAGE_FILE}" "data/virtual_portfolio.json"
            git add data/virtual_portfolio.json

            if git diff --staged --quiet; then
              echo "No changes to data/virtual_portfolio.json detected."
              break
            fi

            if [ "${{ github.event.inputs.reset_portfolio }}" = "true" ]; then
              git commit -m "chore(ledger): operator portfolio baseline reset to \$100,000.00 & kill-switch re-armed (${COMMIT_DATE}) [skip ci]"
            else
              git commit -m "chore(ledger): atomic EOD virtual portfolio update (${COMMIT_DATE}) [skip ci]"
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "::error::Failed to push virtual portfolio update after 3 attempts."
              exit 1
            fi
            echo "Remote branch updated concurrently (attempt ${attempt}/3); retrying on latest HEAD..."
            sleep 2
          done
